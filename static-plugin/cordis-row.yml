# 宿主组合行 —— 把下面这一段追加到 DSH 部署的宿主组合（非 agent preset）
# 追加后：Host 半（static-plugin/src/index.ts 的 export default）随进程自动挂载；
# clientModules 发现本包声明了 dsh.client，自动把浏览器半（lib/client.js）注入页面，
# 无需对话、无需每次批准。
#
# 说明（已按本机部署 profiles/node_modules 核实）：
#  - 该行声明的是"宿主能力"，必须放在宿主组合（进程级 cordis.yml），
#    不能放进某个 agent preset（否则每个会话都会挂一份，与"宿主注册表"冲突）。
#  - name 必须是包的 npm 名。Loader（cordis-plugin-loader）用动态 import(name) 解析包，
#    Node 从配置树（profiles/web）沿 node_modules 链向上查找 ——
#    把包装进 profiles/node_modules（本机用 junction 指向 static-plugin/ 即可）。
#  - 本部署的用户级补丁层是 profiles\web\cordis.patch.yml（bundle 之后、--patch 之前应用），
#    把下面的 insert 追加进去，升级不会覆盖。
#  - 插件集变更需重启 DSH 生效（clientModules 对包元数据有进程内缓存）。

- insert:
    - id: dsh-usage-panel
      name: '@dsh-usage-panel'
      config:
        # 预留：如需把平台 Token 放进配置文件（而非浏览器 localStorage）可在此扩展，
        # 例如 initialToken/initialApiKey（可选，默认走浏览器保存的配置）。
        {}
